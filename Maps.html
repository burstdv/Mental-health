    <h2>Find a Relaxing Spot Near You</h2>
    <div id="map"></div>

    <script>
        // Initialize the map and set the view
        var map = L.map('map').setView([-41.289144, 174.777203], 13);

        // Add OpenStreetMap tile layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Add a marker
        var marker = L.marker([-41.289144, 174.777203]).addTo(map);

        // Bind popups to each shape
        marker.bindPopup("<b>Hello world!</b><br>I am a popup.").openPopup();
        var popup = L.popup();

        // Handle map click events to show coordinates in a popup
        function onMapClick(e) {
            popup
                .setLatLng(e.latlng)
                .setContent("You clicked the map at " + e.latlng.toString())
                .openOn(map);
        }

        map.on('click', onMapClick);
    </script>
    <h2>Find a Relaxing Spot Near You</h2>
